name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: worksense
          POSTGRES_PASSWORD: worksense
          POSTGRES_DB: worksense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worksense" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://worksense:worksense@localhost:5432/worksense
      PGPASSWORD: worksense
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Apply migrations
        run: for f in migrations/*.sql; do psql -h localhost -U worksense -d worksense -v ON_ERROR_STOP=1 -f "$f"; done
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
