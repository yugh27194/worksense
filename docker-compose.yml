# 로컬 개발용 PostgreSQL + pgvector. 첫 기동 시 migrations/*.sql 이 순서대로 적용된다.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: worksense
      POSTGRES_PASSWORD: worksense
      POSTGRES_DB: worksense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksense"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
