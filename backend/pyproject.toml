[project]
name = "worksense-backend"
version = "0.1.0"
description = "일머RE MVP 백엔드: 업무교육 영상 → 쉬운 단계별 매뉴얼 → RAG 질의응답"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "google-genai>=1.0",
  "kiwipiepy>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI 의 Depends/File/Form 기본값 관용구
